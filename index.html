<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <title>NEON ROLLER // MOMENTUM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">MOMENTUM PROTOCOL // 01</p>
        <h1>NEON <span>ROLLER</span></h1>
      </div>
      <div class="status"><i></i><span id="statusText">SYSTEM ONLINE</span></div>
    </header>

    <section class="game-wrap" aria-label="Neon Roller game">
      <canvas id="game" width="960" height="540"></canvas>
      <div class="hud">
        <div class="hud-card"><small>SECTOR</small><strong id="levelName">BOOTING</strong></div>
        <div class="hud-card"><small>SHARDS</small><strong><span id="score">000</span> <b>/</b> <span id="total">000</span></strong></div>
        <div class="hud-card"><small>TIME</small><strong id="time">00:00</strong></div>
        <div class="hud-card boss-hud" id="bossHud"><small>CORE HP</small><strong><span id="bossHealth">000</span> / 3</strong></div>
      </div>
      <div id="message" class="message">Loading world...</div>
    </section>

    <nav class="controls" aria-label="Controls">
      <span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> MOVE</span>
      <span><kbd>SPACE</kbd> JUMP</span>
      <span><kbd>X</kbd> / <kbd>CLICK</kbd> FIRE GUN</span>
      <span><kbd>R</kbd> RESET</span>
      <span class="secret-hint">??? <b>TYPE HIDDEN</b> ???</span>
    </nav>

    <div class="touch-controls">
      <button data-key="left" aria-label="Move left">◀</button>
      <button data-key="jump" aria-label="Jump">●</button>
      <button data-key="right" aria-label="Move right">▶</button>
      <button id="fireButton" aria-label="Fire">✦</button>
    </div>
    <button id="exitSecret" class="exit-secret" type="button">↩ EXIT HIDDEN LEVEL</button>

    <p class="footer">ROLL WITH THE FLOW <span>•</span> COLLECT EVERY SHARD <span>•</span> REACH THE GATE</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/level.js"></script>
  <script src="js/collide.js"></script>
  <script src="js/player.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
